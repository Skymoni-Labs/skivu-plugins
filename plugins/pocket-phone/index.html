<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>角色小手机</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="views.css">
</head>
<body>
  <div id="phone" aria-label="角色小手机">
    <header class="toolbar">
      <button id="back" class="icon" aria-label="返回小手机桌面" hidden>‹</button>
      <div class="identity"><span id="owner">角色小手机</span><small id="role-label">正在读取…</small></div>
      <button id="role-task" class="icon" aria-label="让角色更新小手机" title="让角色更新">✦</button>
      <button id="conversation" class="icon" aria-label="角色对话" title="角色对话">☏</button>
      <button id="settings" class="icon" aria-label="小手机设置" title="设置">⚙</button>
    </header>
    <div id="progress" class="progress" hidden aria-label="正在处理"></div>
    <div id="problem" role="alert" hidden></div>
    <main id="screen" tabindex="-1"><div class="empty"><h1>打开一份日常</h1><p>正在载入本机记录…</p></div></main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <dialog id="editor"><form id="edit-form"><header><h2 id="edit-title"></h2><button type="button" id="edit-close" class="icon" aria-label="关闭">×</button></header><div id="edit-content"></div><p id="edit-error" role="alert" hidden></p><footer id="edit-buttons"></footer></form></dialog>
  <script src="/skivu-sdk.js"></script>
  <script src="vendor/suncalc.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
