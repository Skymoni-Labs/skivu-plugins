<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>插件实验室</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<div class="eyebrow">SKIVU OPEN PLUGIN · SDK 1.0</div><h1>你的界面，你的逻辑。</h1>
<p class="intro">这是从插件包加载的独立页面。修改 HTML、CSS、JavaScript 即可创造自己的工具、游戏和聊天界面。</p>
<section class="counter"><div class="label">已可靠保存的计数</div><strong id="count">—</strong><button id="increment">增加并保存</button><small id="save-state">正在读取存档…</small></section>
<div class="grid"><button id="context">查看所选上下文</button><button id="capabilities">查看 SDK 能力</button><button id="export">导出存档</button><button id="import">导入存档</button></div>
<section><div class="label">操作结果</div><pre id="output" aria-live="polite">连接宿主中…</pre></section>
<footer>只申请本插件存储与系统文件选择权限。没有服务器配置或密钥访问接口。</footer>
</main><script src="app.js" type="module"></script></body></html>
